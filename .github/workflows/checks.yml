name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Profile revocation concurrency regression
        run: node supabase/tests/profile-revocation-concurrency.mjs
      - run: npm run typecheck
      - run: npm run build
